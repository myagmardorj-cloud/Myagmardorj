<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — NexCore</title>
<link rel="stylesheet" href="/style.css">
<style>
.not-found {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 40px;
  flex-direction: column;
}
.not-found-num {
  font-family: 'Syne', sans-serif;
  font-size: 10rem; font-weight: 800;
  letter-spacing: -0.05em;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; line-height: 1;
}
.not-found h2 {
  font-family: 'Syne', sans-serif;
  font-size: 1.8rem; font-weight: 700;
  margin: 16px 0 12px;
}
.not-found p { color: var(--muted); margin-bottom: 32px; }
</style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursor-ring"></div>
<nav>
  <a href="/index.html" class="logo">Nex<span class="logo-dot">Core</span></a>
</nav>
<div class="not-found">
  <div class="not-found-num">404</div>
  <h2>Хуудас олдсонгүй</h2>
  <p>Таны хайж буй хуудас байхгүй эсвэл нүүлгэсэн байна.</p>
  <a href="/index.html" class="btn btn-primary">Нүүр хуудас руу буцах</a>
</div>
<script src="/main.js"></script>
</body>
</html>
