<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Номин Холдинг ХХК - Монголын тэргүүлэгч холдинг компани">
<title>НОМИН Холдинг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#4D68EF;--blue-dark:#3a52d4;--blue-light:#EEF1FD;--text:#1a1a2e;--text-sec:#5a6880;--text-light:#94a3b8;--border:#e8ecf2;--bg:#fff;--bg2:#f7f9fc}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#fff;color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.util-bar{background:var(--blue);padding:7px 0}
.util-in{max-width:1280px;margin:0 auto;padding:0 2rem;display:flex;justify-content:space-between;align-items:center}
.util-links{display:flex;gap:1.8rem}
.util-links a{color:rgba(255,255,255,.75);font-size:.72rem;transition:color .2s}
.util-links a:hover{color:#fff}
.util-right{display:flex;align-items:center;gap:1.4rem}
.util-phone{color:#fff;font-weight:700;font-size:.72rem}
.lang-sw{display:flex;gap:3px}
.lang-btn{background:none;border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.8);padding:2px 10px;font-size:.65rem;font-weight:700;cursor:pointer;letter-spacing:.06em;transition:all .2s;border-radius:2px}
.lang-btn.act{background:#fff;color:var(--blue);border-color:#fff}
.lang-btn:hover:not(.act){background:rgba(255,255,255,.15)}
header{position:sticky;top:0;z-index:200;background:#fff;border-bottom:1px solid var(--border);transition:box-shadow .25s}
header.scrolled{box-shadow:0 2px 16px rgba(0,0,0,.08)}
.hdr{max-width:1280px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:68px}
.hdr-logo img{height:38px;width:auto}
nav{display:flex;align-items:center}
.ni{position:relative}
.nl{display:flex;align-items:center;gap:5px;color:var(--text);font-size:.8rem;font-weight:500;padding:8px 14px;white-space:nowrap;transition:color .2s}
.nl:hover{color:var(--blue)}
.nl .chev{width:10px;height:10px;opacity:.45;transition:transform .2s}
.ni:hover .chev{transform:rotate(180deg)}
.drop{display:none;position:absolute;top:100%;left:0;background:#fff;min-width:230px;border:1px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.1);z-index:300;border-top:2px solid var(--blue)}
.ni:hover .drop{display:block}
.drop a{display:block;padding:10px 20px;font-size:.78rem;color:var(--text-sec);border-bottom:1px solid var(--border);transition:all .15s}
.drop a:last-child{border:none}
.drop a:hover{color:var(--blue);background:var(--blue-light);padding-left:26px}
.hdr-r{display:flex;align-items:center;gap:8px}
.btn-eshop{background:var(--blue);color:#fff;padding:9px 20px;font-size:.77rem;font-weight:700;border-radius:2px;transition:background .2s}
.btn-eshop:hover{background:var(--blue-dark)}
.btn-srch{width:36px;height:36px;border:1px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-sec);transition:all .2s;border-radius:2px}
.btn-srch:hover{border-color:var(--blue);color:var(--blue)}
.hero{position:relative;width:100%;height:72vh;min-height:500px;overflow:hidden;background:#1a2540}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;display:flex;align-items:flex-end}
.hero-slide.active{opacity:1}
.hero-slide .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-slide .ovl{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,16,35,.88) 0%,rgba(10,16,35,.25) 55%,transparent 100%)}
.hero-content{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:0 2rem 3.5rem;width:100%}
.hero-cat{display:inline-block;background:var(--blue);color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:3px 12px;margin-bottom:.9rem}
.hero-title{font-family:'Montserrat',sans-serif;font-size:clamp(1.6rem,3.2vw,2.7rem);font-weight:800;color:#fff;line-height:1.2;max-width:680px;margin-bottom:1rem}
.hero-link{display:inline-flex;align-items:center;gap:8px;color:#fff;font-size:.8rem;font-weight:600;border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:2px;transition:border-color .2s}
.hero-link:hover{border-color:#fff}
.hero-dots{position:absolute;bottom:1.4rem;right:2rem;display:flex;gap:6px;z-index:10}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:all .3s}
.dot.active{background:#fff;width:22px;border-radius:3px}
.hero-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:10;background:rgba(255,255,255,.12);border:none;color:#fff;width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:background .2s;backdrop-filter:blur(4px)}
.hero-nav:hover{background:rgba(255,255,255,.25)}
.hero-prev{left:1.5rem}.hero-next{right:1.5rem}
.ticker{background:var(--blue-light);border-bottom:1px solid var(--border);padding:8px 0;overflow:hidden}
.ticker-track{display:flex;gap:3rem;animation:tick 35s linear infinite;white-space:nowrap}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ti{font-size:.7rem;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:8px;flex-shrink:0;letter-spacing:.04em}
.ti::before{content:'◆';font-size:.3rem}
.stats-bar{background:#fff;border-bottom:1px solid var(--border)}
.stats-in{max-width:1280px;margin:0 auto;padding:0 2rem;display:grid;grid-template-columns:repeat(6,1fr)}
.stat-cell{padding:1.8rem 1rem;text-align:center;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:4px}
.stat-cell:last-child{border-right:none}
.stat-num{font-family:'Montserrat',sans-serif;font-size:1.55rem;font-weight:800;color:var(--blue);line-height:1}
.stat-lbl{font-size:.65rem;color:var(--text-light);font-weight:500;line-height:1.4}
.container{max-width:1280px;margin:0 auto;padding:0 2rem}
.sec-label{font-size:.64rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);margin-bottom:.6rem;display:flex;align-items:center;gap:8px}
.sec-label::before{content:'';width:18px;height:2px;background:var(--blue)}
.sec-title{font-family:'Montserrat',sans-serif;font-size:clamp(1.45rem,2.8vw,2rem);font-weight:800;line-height:1.2;color:var(--text)}
.view-all{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-size:.77rem;font-weight:700;transition:gap .2s}
.view-all:hover{gap:10px}.view-all::after{content:'→'}
#news{padding:4.5rem 0}
.news-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--border);margin-top:2rem}
.news-feat{grid-row:span 2;position:relative;overflow:hidden;min-height:460px;background:#1a2540;cursor:pointer;display:flex;align-items:flex-end}
.news-feat .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .5s}
.news-feat:hover .bg{transform:scale(1.03)}
.news-feat .ovl{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,14,30,.92) 0%,rgba(8,14,30,.12) 62%,transparent 100%)}
.news-feat-body{position:relative;z-index:2;padding:1.8rem}
.nf-cat{display:inline-block;background:var(--blue);color:#fff;font-size:.58rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;padding:3px 10px;margin-bottom:.75rem}
.nf-title{font-family:'Montserrat',sans-serif;font-size:1.22rem;font-weight:700;color:#fff;line-height:1.3;margin-bottom:.5rem}
.nf-date{font-size:.67rem;color:rgba(255,255,255,.5)}
.news-sm{background:#fff;min-height:220px;cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.news-sm .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .5s}
.news-sm:hover .bg{transform:scale(1.03)}
.news-sm .ovl{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,14,30,.9) 0%,rgba(8,14,30,.08) 65%,transparent 100%)}
.news-sm-body{position:relative;z-index:2;padding:1.1rem 1.4rem}
.ns-cat{display:inline-block;background:var(--blue);color:#fff;font-size:.54rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;margin-bottom:.45rem}
.ns-title{font-size:.87rem;font-weight:700;color:#fff;line-height:1.35}
.ns-date{font-size:.62rem;color:rgba(255,255,255,.45);margin-top:4px}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:480px}
.split-img{position:relative;overflow:hidden;min-height:360px}
.img-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.split-body{padding:4rem 3.5rem;display:flex;flex-direction:column;justify-content:center}
.split-body p{color:var(--text-sec);font-size:.9rem;line-height:1.85;margin-bottom:.9rem}
.split-body p:last-of-type{margin-bottom:1.8rem}
.bg-gray{background:#f7f9fc}
.bg-blue{background:var(--blue)}
.bg-blue .sec-label{color:rgba(255,255,255,.6)}
.bg-blue .sec-label::before{background:rgba(255,255,255,.45)}
.bg-blue .sec-title{color:#fff}
.bg-blue p{color:rgba(255,255,255,.75)!important}
.btn-blue{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;padding:12px 26px;font-size:.8rem;font-weight:700;border-radius:2px;transition:background .2s}
.btn-blue:hover{background:var(--blue-dark)}
.btn-outline{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--blue);color:var(--blue);padding:11px 24px;font-size:.8rem;font-weight:700;border-radius:2px;transition:all .2s}
.btn-outline:hover{background:var(--blue-light)}
.btn-white{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--blue);padding:12px 26px;font-size:.8rem;font-weight:700;border-radius:2px;transition:all .2s}
.btn-white:hover{background:var(--blue-light)}
#newslist{background:#f7f9fc;padding:4.5rem 0}
.nl-hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2rem}
.nl-items{background:var(--border);display:grid;gap:1px}
.nl-item{display:grid;grid-template-columns:1fr auto;align-items:start;gap:2rem;background:#fff;padding:1.4rem 1.8rem;transition:background .2s;cursor:pointer}
.nl-item:hover{background:var(--blue-light)}
.nl-date{font-size:.68rem;color:var(--text-light);white-space:nowrap;padding-top:3px}
.nl-cat{display:inline-block;font-size:.57rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:.35rem}
.nl-title{font-size:.91rem;font-weight:600;color:var(--text);line-height:1.45}
.nl-sub{font-size:.78rem;color:var(--text-sec);margin-top:.3rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nl-more{text-align:center;padding:1.5rem;background:#fff;border-top:1px solid var(--border)}
#card{display:grid;grid-template-columns:1fr 1fr;min-height:360px}
.card-img{position:relative;overflow:hidden}
.ph-card-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2a3faa 0%,#1a2f8a 100%)}
.ph-card{width:260px;height:160px;background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.05) 100%);border-radius:14px;border:1px solid rgba(255,255,255,.18);display:flex;align-items:flex-end;padding:1.2rem 1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ph-card-logo{font-family:'Montserrat',sans-serif;font-weight:800;font-size:.95rem;color:#fff;letter-spacing:.06em}
.ph-card-sub{font-size:.6rem;color:rgba(255,255,255,.55);margin-top:3px}
.card-body{background:var(--blue);padding:3.5rem;display:flex;flex-direction:column;justify-content:center}
.card-body .sec-label{color:rgba(255,255,255,.55)}
.card-body .sec-label::before{background:rgba(255,255,255,.4)}
.card-body .sec-title{color:#fff;margin-bottom:1rem}
.card-body p{color:rgba(255,255,255,.72);font-size:.9rem;line-height:1.82;margin-bottom:1.6rem}
#careers{display:grid;grid-template-columns:1fr 1fr;min-height:380px}
.careers-img{position:relative;overflow:hidden}
.careers-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a2540 0%,#2a3f8f 100%);font-size:5rem;opacity:.18}
.careers-body{background:#f7f9fc;padding:3.5rem;display:flex;flex-direction:column;justify-content:center}
.careers-body p{color:var(--text-sec);font-size:.9rem;line-height:1.82;margin-bottom:1.6rem}
.careers-btns{display:flex;gap:10px;flex-wrap:wrap}
#social{background:#fff;border-top:1px solid var(--border);padding:3rem 0}
.social-inner{max-width:1280px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1.5rem}
.social-title{font-family:'Montserrat',sans-serif;font-size:1.25rem;font-weight:800;color:var(--text)}
.social-links{display:flex;gap:10px}
.soc-btn{display:flex;align-items:center;gap:7px;padding:10px 18px;border:1.5px solid var(--border);font-size:.77rem;font-weight:600;color:var(--text-sec);border-radius:2px;transition:all .2s}
.soc-btn:hover{border-color:var(--blue);color:var(--blue)}
footer{background:#1a2540;color:rgba(255,255,255,.6)}
.ft-main{padding:3.5rem 0 2rem}
.ft-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr;gap:3rem}
.ft-logo img{height:28px;filter:brightness(0) invert(1);margin-bottom:1rem}
.ft-desc{font-size:.76rem;line-height:1.8;max-width:240px;margin-bottom:1.2rem}
.ft-soc{display:flex;gap:6px}
.ft-sb{width:32px;height:32px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:2px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:.78rem;transition:all .2s}
.ft-sb:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.ft-col h4{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#fff;margin-bottom:1rem}
.ft-col ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.ft-col ul li a{font-size:.76rem;color:rgba(255,255,255,.46);transition:color .2s}
.ft-col ul li a:hover{color:#fff}
.ft-ci{display:flex;gap:8px;font-size:.75rem;color:rgba(255,255,255,.43);margin-bottom:.6rem;line-height:1.55}
.ft-ci strong{color:rgba(255,255,255,.68);min-width:20px}
.ft-bottom{border-top:1px solid rgba(255,255,255,.07);padding:1.2rem 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem}
.ft-copy{font-size:.68rem;color:rgba(255,255,255,.28)}
.ft-links{display:flex;gap:1.4rem}
.ft-links a{font-size:.68rem;color:rgba(255,255,255,.28);transition:color .2s}
.ft-links a:hover{color:#fff}
.chat-w{position:fixed;bottom:1.5rem;right:1.5rem;z-index:500}
.chat-tog{width:52px;height:52px;border-radius:50%;background:var(--blue);border:none;color:#fff;cursor:pointer;box-shadow:0 4px 20px rgba(77,104,239,.4);transition:transform .2s;display:flex;align-items:center;justify-content:center;margin-left:auto}
.chat-tog:hover{transform:scale(1.08)}
.chat-pan{display:none;flex-direction:column;width:320px;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.14);margin-bottom:10px}
.chat-pan.open{display:flex}
.chat-h{background:var(--blue);padding:14px 16px;display:flex;align-items:center;gap:10px}
.chat-av{width:34px;height:34px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem}
.chat-nm{font-size:.82rem;font-weight:700;color:#fff}
.chat-st{font-size:.62rem;color:rgba(255,255,255,.65);display:flex;align-items:center;gap:4px}
.chat-st::before{content:'';width:5px;height:5px;background:#4ade80;border-radius:50%}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:7px;min-height:140px;max-height:260px}
.msg{padding:8px 12px;border-radius:8px;font-size:.77rem;line-height:1.5;max-width:88%}
.msg.bot{background:#f7f9fc;color:var(--text);align-self:flex-start}
.msg.user{background:var(--blue);color:#fff;align-self:flex-end}
.chat-inp-row{display:flex;border-top:1px solid var(--border)}
.chat-inp{flex:1;border:none;padding:11px 14px;font-family:'Inter',sans-serif;font-size:.78rem;outline:none;color:var(--text)}
.chat-snd{background:var(--blue);border:none;padding:0 14px;color:#fff;cursor:pointer;transition:background .2s}
.chat-snd:hover{background:var(--blue-dark)}
.srch-ov{position:fixed;inset:0;background:rgba(8,12,28,.93);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding-top:10vh;backdrop-filter:blur(8px)}
.srch-ov.open{display:flex}
.srch-b{width:100%;max-width:580px;padding:0 2rem}
.srch-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:4px;padding:14px 18px}
.s-ico{color:var(--blue)}
.s-inp{flex:1;border:none;font-family:'Montserrat',sans-serif;font-size:1.1rem;font-weight:600;color:var(--text);outline:none}
.s-cls{background:none;border:none;color:var(--text-sec);cursor:pointer;font-size:1rem}
.srch-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:1rem}
.stag{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.58);padding:5px 12px;border-radius:20px;font-size:.72rem;cursor:pointer;transition:all .2s}
.stag:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.srch-hint{font-size:.64rem;color:rgba(255,255,255,.22);margin-top:.6rem;letter-spacing:.08em}
@media(max-width:1020px){
  .news-grid{grid-template-columns:1fr}.news-feat{grid-row:span 1;min-height:300px}
  .split{grid-template-columns:1fr}.split-img{min-height:280px}
  #card,#careers{grid-template-columns:1fr}.card-img,.careers-img{min-height:260px}
  .stats-in{grid-template-columns:repeat(3,1fr)}.ft-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:768px){nav,.util-links{display:none}.stats-in{grid-template-columns:repeat(2,1fr)}.split-body,.card-body,.careers-body{padding:2.5rem 1.5rem}.ft-grid{grid-template-columns:1fr}}
</style>
</head>

// ═══════════════════════════════════════════════
// ENGINE
// ═══════════════════════════════════════════════
let curLang = 'mn';

function t(k){ return LANG[curLang][k] || LANG.mn[k] || ''; }

function applyLang(){
  // text nodes
  document.querySelectorAll('[data-t]').forEach(el=>{
    const v = t(el.dataset.t);
    if(v) el.innerHTML = v;
  });
  // placeholders
  document.querySelectorAll('[data-t-ph]').forEach(el=>{
    const v = t(el.dataset.tPh);
    if(v) el.placeholder = v;
  });
  // lang buttons active state
  document.querySelectorAll('.lang-btn').forEach((b,i)=>{
    const langs=['mn','en','ru'];
    b.classList.toggle('act', langs[i]===curLang);
  });
  // html lang attr
  document.documentElement.lang = curLang==='mn'?'mn': curLang==='ru'?'ru':'en';
  // ticker
  buildTicker();
  // search tags
  buildTags();
}

function setLang(lang){
  curLang = lang;
  try{ localStorage.setItem('nomin_lang', lang); }catch(e){}
  applyLang();
}

function buildTicker(){
  const items = LANG[curLang].ticker || LANG.mn.ticker;
  const doubled = [...items,...items];
  document.getElementById('ticker-track').innerHTML =
    doubled.map(s=>`<span class="ti">${s}</span>`).join('');
}

function buildTags(){
  const tags = LANG[curLang].tags || LANG.mn.tags;
  document.getElementById('stags').innerHTML =
    tags.map(t=>`<button class="stag" onclick="document.getElementById('si').value=this.textContent;document.getElementById('si').focus()">${t}</button>`).join('');
}

// ═══════════════════════════════════════════════
// HERO SLIDER
// ═══════════════════════════════════════════════
let cur=0,tot=4,timer;
function goSlide(n){
  document.querySelectorAll('.hero-slide').forEach((s,i)=>s.classList.toggle('active',i===n));
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===n));
  cur=n;
}
function slide(d){goSlide((cur+d+tot)%tot);resetTimer();}
function resetTimer(){clearInterval(timer);timer=setInterval(()=>slide(1),5500);}
resetTimer();

// HEADER SCROLL
window.addEventListener('scroll',()=>document.getElementById('hdr').classList.toggle('scrolled',window.scrollY>50));

// CHATBOT
function sc(){
  const inp=document.getElementById('ci'),m=document.getElementById('cm'),text=inp.value.trim();
  if(!text)return;
  m.innerHTML+=`<div class="msg user">${text}</div>`;
  inp.value=''; m.scrollTop=m.scrollHeight;
  setTimeout(()=>{
    const lc=text.toLowerCase();
    const rep=LANG[curLang].chat_replies||LANG.mn.chat_replies;
    let r=rep.default;
    for(const[k,v]of Object.entries(rep))if(lc.includes(k)){r=v;break;}
    m.innerHTML+=`<div class="msg bot">${r}</div>`;
    m.scrollTop=m.scrollHeight;
  },600);
}
document.addEventListener('keypress',e=>{if(e.target.id==='ci'&&e.key==='Enter')sc();});

// SEARCH
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')document.getElementById('so').classList.remove('open');
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('so').classList.add('open');setTimeout(()=>document.getElementById('si').focus(),50);}
});

// INIT — run immediately (scripts at bottom, DOM already ready)
(function init(){
  try{ const s=localStorage.getItem('nomin_lang'); if(s) curLang=s; }catch(e){}
  applyLang();
})();
</script>
