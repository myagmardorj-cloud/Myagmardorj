<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Replication Guide · research.nexcore.ltd</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--bg:#070710;--s1:#0e0e1c;--s2:#13131f;--border:rgba(255,255,255,.07);--text:#eeeef8;--sub:#9999b8;--muted:#5a5a7a;--cyan:#00d4ff;--blue:#4d9fff;--green:#00e5a0;--gold:#f0b429;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;line-height:1.7;padding-top:56px;padding-bottom:48px;}
nav.MN{position:fixed;top:0;left:0;right:0;z-index:500;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;background:rgba(7,7,16,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.MN-logo{font-family:'Space Grotesk',sans-serif;font-size:.88rem;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;flex-shrink:0;}
.MN-links{display:flex;align-items:center;gap:.2rem;flex-shrink:0;}
.MN-links a{font-family:'Plus Jakarta Sans',sans-serif;font-size:.76rem;color:var(--sub);text-decoration:none;padding:.28rem .55rem;border-radius:7px;transition:all .2s;white-space:nowrap;}
.MN-links a:hover,.MN-links a.MN-cur{color:var(--text);background:rgba(255,255,255,.07);}
.MN-lb{font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:.26rem .55rem;border:none;cursor:pointer;transition:all .2s;}
.MN-lb:first-child{border-radius:4px 0 0 4px;}
.MN-lb:last-child{border-radius:0 4px 4px 0;}
.MN-lb.MN-active{background:linear-gradient(135deg,#0055ff,var(--cyan));color:#fff;}
.MN-lb:not(.MN-active){background:rgba(255,255,255,.05);color:var(--muted);border:1px solid rgba(255,255,255,.12);}
[data-li]{display:none;}
body.en [data-li="en"]{display:inline;}
body.mn [data-li="mn"]{display:inline;}
footer.MN-foot{position:fixed;bottom:0;left:0;right:0;z-index:500;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 2rem;background:rgba(7,7,16,.98);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.08);font-family:'JetBrains Mono',monospace;font-size:.65rem;color:#5a5a7a;letter-spacing:.02em;}footer.MN-foot .MN-foot-left{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}footer.MN-foot .MN-foot-center{display:flex;gap:.2rem;align-items:center;flex-shrink:0;}footer.MN-foot .MN-foot-right{flex:1;text-align:right;flex-shrink:0;}footer.MN-foot a{color:#5a5a7a;text-decoration:none;padding:.22rem .5rem;border-radius:5px;transition:color .15s,background .15s;white-space:nowrap;}footer.MN-foot a:hover{color:#00d4ff;background:rgba(0,212,255,.07);}footer.MN-foot .foot-sep{width:1px;height:12px;background:rgba(255,255,255,.1);margin:0 .3rem;}
.MN-foot a{color:var(--muted);text-decoration:none;padding:.2rem .4rem;transition:color .2s;}
.MN-foot a:hover{color:var(--cyan);}
.container{max-width:860px;margin:0 auto;padding:2rem 2rem 3rem;}
.sec-label{font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(0,212,255,.3),transparent);}
h1{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700;margin-bottom:.6rem;letter-spacing:-.03em;}
h2{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;margin:2rem 0 .8rem;letter-spacing:-.02em;}
h3{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:600;margin:1.5rem 0 .5rem;color:var(--cyan);}
p{color:var(--sub);margin-bottom:1rem;}
.step{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem;position:relative;}
.step-num{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--cyan);background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.2);padding:.2rem .5rem;border-radius:4px;display:inline-block;margin-bottom:.6rem;}
.step h3{margin-top:0;color:var(--text);}
pre{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:1rem 1.2rem;font-family:'JetBrains Mono',monospace;font-size:.78rem;color:#a8d8a0;overflow-x:auto;margin:.8rem 0;}
.dl-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:1.2rem 1.5rem;margin-bottom:.8rem;display:flex;justify-content:space-between;align-items:center;}
.dl-info{flex:1;}
.dl-name{font-family:'JetBrains Mono',monospace;font-size:.85rem;color:var(--cyan);margin-bottom:.2rem;}
.dl-desc{font-size:.85rem;color:var(--sub);}
.dl-size{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);margin-left:1rem;}
.badge{font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:.2rem .55rem;border-radius:4px;display:inline-block;margin-right:.4rem;}
.badge-green{background:rgba(0,229,160,.1);color:var(--green);border:1px solid rgba(0,229,160,.2);}
.badge-gold{background:rgba(240,180,41,.1);color:var(--gold);border:1px solid rgba(240,180,41,.2);}
.note{background:rgba(0,212,255,.04);border:1px solid rgba(0,212,255,.15);border-radius:10px;padding:1rem 1.2rem;margin:1rem 0;font-size:.88rem;color:var(--sub);}.MN-more{position:relative;}
.MN-more>button{font-family:'Plus Jakarta Sans',sans-serif;font-size:.76rem;color:var(--sub,#9999b8);background:none;border:none;padding:.28rem .55rem;border-radius:7px;cursor:pointer;white-space:nowrap;transition:all .2s;}
.MN-more>button:hover{color:var(--text,#eeeef8);background:rgba(255,255,255,.07);}
.MN-dd{display:none;position:absolute;top:calc(100% + 6px);right:0;background:rgba(12,12,24,.98);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:.4rem;min-width:160px;z-index:600;backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,.6);}
.MN-dd.open{display:block;}
.MN-dd a{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:.78rem;color:#9999b8;text-decoration:none;padding:.36rem .85rem;border-radius:8px;transition:background .15s;white-space:nowrap;}
.MN-dd a:hover{color:#eeeef8;background:rgba(255,255,255,.06);}

nav.MN{position:fixed !important;top:0;left:0;right:0;z-index:900;}
footer.MN-foot{position:fixed !important;bottom:0;left:0;right:0;z-index:900;
  height:44px;display:flex;justify-content:space-between;align-items:center;
  padding:0 1.5rem;background:rgba(7,7,16,.98);backdrop-filter:blur(24px);
  border-top:1px solid rgba(255,255,255,.08);font-family:'JetBrains Mono',monospace;
  font-size:.65rem;color:#5a5a7a;letter-spacing:.02em;}
footer.MN-foot .MN-foot-left{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
footer.MN-foot .MN-foot-center{display:flex;gap:.2rem;align-items:center;flex-shrink:0;}
footer.MN-foot .MN-foot-right{flex:1;text-align:right;}
footer.MN-foot a{color:#5a5a7a;text-decoration:none;padding:.22rem .5rem;border-radius:5px;transition:color .15s,background .15s;white-space:nowrap;}
footer.MN-foot a:hover{color:#00d4ff;background:rgba(0,212,255,.07);}
body{padding-top:56px !important;padding-bottom:52px !important;}
</style>
